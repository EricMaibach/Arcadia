version: '3.8'
services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - tika
      - qdrant
      - ollama
    environment:
      - QDRANT_URL=http://qdrant:6333
      - TIKA_URL=http://tika:9998
      - OLLAMA_URL=http://ollama:11434
      # OpenAI Configuration (from .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4}
    volumes:
      - ..:/workspace:cached
      - ~/.config/Code/User:/root/.config/Code/User:cached
      - ~/.vscode-server:/root/.vscode-server:cached
    ports:
      - "8080:8080"
      - "3000:3000"
    command: sleep infinity
  tika:
    image: apache/tika:latest
    ports:
      - "9998:9998"
  qdrant:
    image: qdrant/qdrant:v1.13.3
    ports:
      - "6333:6333"
      - "6334:6334"
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "ollama serve &
      sleep 5 &&
      ollama pull embeddinggemma &&
      wait"
volumes:
  ollama_data: